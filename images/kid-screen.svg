<circle cx="618" cy="152" r="18" fill="#f76707"/><text x="618" y="159" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<text x="650" y="159" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#1f2a44" text-anchor="start">The board is the app</text>
<text x="650" y="188" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#4a5470" text-anchor="start">One big living whiteboard fills the screen.</text><text x="650" y="212" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#4a5470" text-anchor="start">The buddy draws, labels and animates on it.</text><path d="M478 564 C560 564 540 292 592 292" fill="none" stroke="#c7ccd6" stroke-width="2.5" stroke-dasharray="4 6"/>
<circle cx="478" cy="564" r="6" fill="#f76707" stroke="#ffffff" stroke-width="2"/>
<circle cx="618" cy="292" r="18" fill="#f76707"/><text x="618" y="299" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="650" y="299" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#1f2a44" text-anchor="start">Play with the answer</text>
<text x="650" y="328" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#4a5470" text-anchor="start">Spin, drag, sort, tap a picture or draw back.</text><text x="650" y="352" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#4a5470" text-anchor="start">Here: slide to spin the Earth.</text><path d="M478 648 C560 648 540 432 592 432" fill="none" stroke="#c7ccd6" stroke-width="2.5" stroke-dasharray="4 6"/>
<circle cx="478" cy="648" r="6" fill="#f76707" stroke="#ffffff" stroke-width="2"/>
<circle cx="618" cy="432" r="18" fill="#f76707"/><text x="618" y="439" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<text x="650" y="439" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#1f2a44" text-anchor="start">Quick check, then stars</text>
<text x="650" y="468" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#4a5470" text-anchor="start">Tap-to-answer chips. Stars are praise,</text><text x="650" y="492" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#4a5470" text-anchor="start">never pressure: no streaks, no guilt.</text><path d="M478 710 C560 710 540 572 592 572" fill="none" stroke="#c7ccd6" stroke-width="2.5" stroke-dasharray="4 6"/>
<circle cx="478" cy="710" r="6" fill="#f76707" stroke="#ffffff" stroke-width="2"/>
<circle cx="618" cy="572" r="18" fill="#f76707"/><text x="618" y="579" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
<text x="650" y="579" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#1f2a44" text-anchor="start">A buddy who talks and points</text>
<text x="650" y="608" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#4a5470" text-anchor="start">Answers out loud with captions, points at what</text><text x="650" y="632" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#4a5470" text-anchor="start">it draws and cheers when you get one right.</text><path d="M478 826 C560 826 540 712 592 712" fill="none" stroke="#c7ccd6" stroke-width="2.5" stroke-dasharray="4 6"/>
<circle cx="478" cy="826" r="6" fill="#f76707" stroke="#ffffff" stroke-width="2"/>
<circle cx="618" cy="712" r="18" fill="#f76707"/><text x="618" y="719" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
<text x="650" y="719" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#1f2a44" text-anchor="start">Type or talk</text>
<text x="650" y="748" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#4a5470" text-anchor="start">“Ask me anything…” plus a big mic button.</text><text x="650" y="772" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#4a5470" text-anchor="start">No prices, ads, links or settings, ever.</text>
<text x="600" y="862" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8a8f9c" text-anchor="start">Illustration of the approved “A + C” direction: the board is</text>
<text x="600" y="884" font-family="'Avenir Next','Nunito','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8a8f9c" text-anchor="start">the app, with a buddy and stars mixed in. Not a screenshot.</text>

</svg>
